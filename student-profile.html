<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student AI Chats — Cable&Net Courses</title>
  <meta name="description" content="Topic summaries a student shared from the AI Mentor, for instructor review.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">

  <!-- Main theme CSS -->
  <link rel="stylesheet" href="css/style.css?v=DA6FA414">

  <style>
    .profile-container {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
      gap: 2rem;
      align-items: start;
      margin-top: 2rem;
    }
    .profile-section {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 1.8rem;
    }
    .profile-section h2 {
      font-size: 1.3rem;
      margin-bottom: 1.2rem;
      color: var(--ink);
    }
    .profile-section h3 { font-size: 1rem; margin-bottom: 1rem; }

    .alert-msg {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      padding: 0.7em 0.9em;
      border-radius: 6px;
      margin-bottom: 1rem;
      display: none;
      border: 1px solid transparent;
      position: fixed;
      top: 1rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2000;
      max-width: 90%;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    }
    .alert-msg.show { display: block; }
    .alert-success { background: #E4EEE1; border-color: var(--green); color: var(--green); }
    .alert-error   { background: #F7E4DC; border-color: var(--copper-dark); color: var(--copper-dark); }
    .alert-info    { background: #E8F4FF; border-color: var(--teal); color: var(--teal); }

    .empty-state {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--ink-soft);
      font-style: italic;
    }

    .mentor-timeline { display: grid; gap: 1rem; }
    .mentor-entry {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 1.3rem 1.4rem;
    }
    .mentor-entry-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.7rem;
    }
    .mentor-entry-head .port-num { margin-bottom: 0; }
    .mentor-course {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      padding: 0.25em 0.7em;
      border: 1px solid var(--teal);
      border-radius: 999px;
      color: var(--teal);
      background: #EFF7F8;
      white-space: nowrap;
    }
    .mentor-date {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--ink-soft);
    }
    .mentor-entry h3 { margin: 0 0 0.35rem; font-size: 1.05rem; }
    .mentor-entry p { margin: 0.4rem 0; font-size: 0.9rem; color: var(--ink); }
    .ai-entry .mentor-entry-head .port-num {
      background: var(--teal);
      color: #fff;
      border: 1px solid var(--teal);
    }
    .ai-count {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      padding: 0.2em 0.6em;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink-soft);
      background: var(--bg);
    }

    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid var(--line);
      border-top-color: var(--copper);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 0.5em;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 860px) {
      .profile-container { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="brand">CABLE<strong>&amp;</strong>NET COURSES</div>
    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="primary-nav">
      <span class="nav-toggle-bar"></span><span class="nav-toggle-bar"></span><span class="nav-toggle-bar"></span>
    </button>
    <nav class="nav-actions" id="primary-nav">
      <a href="instructor-dashboard.html">← Dashboard</a>
      <span id="profileName" style="margin-left:1.4rem; font-family: var(--font-mono); font-size: 0.82rem; color: var(--ink-soft);"></span>
      <span id="profileRole" class="role-badge" style="display:none;"></span>
      <a href="#" id="logoutLink" style="margin-left:1.4rem;">Logout</a>
    </nav>
  </header>

  <div class="wire-divider">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
  </div>

  <main>
    <div class="hero">
      <span class="eyebrow">🤖 AI Mentor Chats</span>
      <h1 id="studentName">Student</h1>
      <p class="lede" id="studentId"></p>
    </div>

    <div id="alert" class="alert-msg" role="alert" aria-live="polite"></div>

    <div class="profile-container">

      <!-- AI Mentor chats -->
      <div class="profile-section">
        <h2>🤖 AI Mentor Chats</h2>
        <p style="font-size:0.85rem; color: var(--ink-soft); margin-top: -0.4rem; margin-bottom: 1.2rem;">
          Topic summaries the student chose to share from "Ask the Mentor". Summaries only — never raw chat messages.
        </p>
        <div class="mentor-timeline" id="aiTimeline">
          <div class="empty-state"><span class="spinner"></span> Loading AI mentor chats...</div>
        </div>
        <div class="empty-state" id="aiEmpty" style="display:none;">
          No shared AI mentor chats yet.
        </div>
      </div>

    </div>
  </main>

  <footer>© 2026 Raj Babna · Cable&amp;Net Courses</footer>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js?v=9A0E5BF5"></script>
  <script src="js/supabase-client.js?v=17E25610"></script>
  <script src="js/mentor-sessions.js?v=5DF3B699"></script>
  <script src="js/menu.js?v=06BC2CFB"></script>
</body>
</html>
