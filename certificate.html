<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate of Completion — Cable&Net Courses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=B4BCB988">
<style>
  .cert-wrap {
    max-width: 820px;
    margin: 2.5rem auto;
    padding: 0 1rem 3rem;
  }
  .cert-sheet {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 3.5rem 3rem;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
  }
  .cert-eyebrow {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--copper-dark);
    display: block;
    margin-bottom: 0.6rem;
  }
  .cert-title {
    font-family: var(--font-display);
    font-size: 2.1rem;
    line-height: 1.1;
    margin: 0 0 1.4rem;
  }
  .cert-rule {
    width: 120px;
    height: 3px;
    background: var(--copper);
    margin: 0 auto 2rem;
    border-radius: 2px;
  }
  .cert-line { color: var(--ink-soft); font-size: 0.95rem; margin: 0.4rem 0 0; }
  .cert-name {
    font-family: var(--font-display);
    font-size: 1.9rem;
    color: var(--teal);
    margin: 0.6rem 0;
  }
  .cert-course {
    font-size: 1.15rem;
    font-weight: 600;
    margin: 0.6rem 0 1.6rem;
  }
  .cert-meta {
    display: flex;
    justify-content: center;
    gap: 2.5rem;
    flex-wrap: wrap;
    margin-top: 2rem;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--ink-soft);
  }
  .cert-meta strong { display: block; color: var(--ink); font-size: 0.85rem; margin-top: 0.25rem; }
  .cert-seal {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 74px;
    height: 74px;
    border-radius: 50%;
    border: 3px solid var(--copper);
    color: var(--copper-dark);
    font-family: var(--font-mono);
    font-size: 0.62rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-align: center;
    margin-top: 2rem;
  }
  .cert-actions {
    display: flex;
    gap: 0.6rem;
    justify-content: center;
    margin-top: 1.6rem;
  }
  .cert-msg {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 2rem;
    text-align: center;
    color: var(--ink-soft);
  }
  .cert-msg .btn { margin-top: 1rem; }
  .cert-badge {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--green);
    border: 1px solid var(--green);
    border-radius: 999px;
    padding: 0.25em 0.8em;
    margin-top: 0.6rem;
  }
  @media print {
    .site-header, .cert-actions, .cert-msg .btn { display: none !important; }
    body { background: #fff; }
    .cert-wrap { margin: 0; padding: 0; }
    .cert-sheet { border: none; box-shadow: none; padding: 1rem; }
  }
</style>
</head>
<body data-course="">

<header class="site-header">
  <div class="brand">CABLE<strong>&amp;</strong>NET COURSES</div>
  <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="primary-nav">
    <span class="nav-toggle-bar"></span><span class="nav-toggle-bar"></span><span class="nav-toggle-bar"></span>
  </button>
  <nav class="nav-actions" id="primary-nav">
    <a href="student-dashboard.html">Dashboard</a>
    <span data-user-name style="margin-left:1.4rem; font-family: var(--font-mono); font-size: 0.82rem; color: var(--ink-soft);"></span>
    <a href="#" data-action="logout" style="margin-left:1.4rem;">Log out</a>
  </nav>
</header>

<main>
  <div class="cert-wrap" id="certWrap">
    <div class="cert-msg"><span class="spinner"></span> Checking completion…</div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js?v=9A0E5BF5"></script>
<script src="js/supabase-client.js?v=17E25610"></script>
<script src="js/menu.js?v=06BC2CFB"></script>
<script>
  (function () {
    'use strict';

    function queryParam(name) {
      var m = new RegExp('[?&]' + name + '=([^&]+)').exec(window.location.search);
      return m ? decodeURIComponent(m[1]) : null;
    }
    var courseId = queryParam('course') || '';

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function fmtDate(iso) {
      try { return new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' }); }
      catch (e) { return String(iso || ''); }
    }

    function renderCert(data) {
      var wrap = document.getElementById('certWrap');
      wrap.innerHTML = `
        <div class="cert-sheet">
          <span class="cert-eyebrow">Cable&amp;Net Courses · Certificate of Completion</span>
          <h1 class="cert-title">Certificate of Completion</h1>
          <div class="cert-rule"></div>
          <p class="cert-line">This certifies that</p>
          <div class="cert-name">${esc(data.student_name)}</div>
          <p class="cert-line">has successfully completed the course</p>
          <div class="cert-course">${esc(data.course_title)}</div>
          <div class="cert-seal">Cable<br>&amp; Net<br>Courses</div>
          <div class="cert-meta">
            <div>Date<strong>${fmtDate(data.issued_at)}</strong></div>
            <div>Certificate No.<strong>${esc(data.cert_number)}</strong></div>
          </div>
          <div class="cert-actions">
            <button class="btn btn-primary" onclick="window.print()">Print / Save PDF</button>
            <a class="btn btn-ghost" href="student-dashboard.html">Back to dashboard</a>
          </div>
        </div>`;
    }

    (async function () {
      var userEl = document.querySelector('[data-user-name]');
      var session = null;
      try {
        session = (await supabaseClient.auth.getSession()).data.session;
      } catch (e) { /* fall through */ }

      if (!session) { window.location.href = 'login.html'; return; }
      if (userEl) userEl.textContent = session.user.email;

      if (!courseId) {
        document.getElementById('certWrap').innerHTML =
          '<div class="cert-msg">Missing course. <a href="student-dashboard.html">Back to dashboard</a></div>';
        return;
      }

      var res;
      try {
        res = await supabaseClient.rpc('issue_certificate', { p_course_id: courseId });
      } catch (err) {
        console.error('Certificate error:', err);
        document.getElementById('certWrap').innerHTML =
          '<div class="cert-msg">Could not load your certificate. Please try again.</div>';
        return;
      }

      if (res.error) {
        console.error('Certificate RPC error:', res.error.message);
        document.getElementById('certWrap').innerHTML =
          '<div class="cert-msg">Could not load your certificate. Please try again.</div>';
        return;
      }

      var data = res.data;
      if (data && data.ok) {
        renderCert(data);
        return;
      }

      if (data && data.reason === 'not_authenticated') {
        window.location.href = 'login.html';
        return;
      }

      document.getElementById('certWrap').innerHTML =
        '<div class="cert-msg">'
        + '<p>You haven\u2019t completed this course yet. Finish all modules to unlock your certificate.</p>'
        + '<a class="btn btn-primary" href="course-' + esc(courseId) + '.html">Back to course</a>'
        + '</div>';
    })();

    document.querySelectorAll('[data-action="logout"]').forEach(function (link) {
      link.addEventListener('click', async function (e) {
        e.preventDefault();
        await supabaseClient.auth.signOut();
        window.location.href = 'login.html';
      });
    });
  })();
</script>
</body>
</html>
