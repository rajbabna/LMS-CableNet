<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — Cable&Net Courses</title>
  <meta name="description" content="Log in to Cable&Net Courses to access your enrolled courses and track your progress.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">

  <!-- Shared theme -->
  <link rel="stylesheet" href="css/style.css?v=FC0333DE">

  <style>
    /* Login-page layout overrides */
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .auth-shell {
      width: 100%;
      max-width: 420px;
    }

    /* Message styling */
    .msg {
      border-left: 4px solid transparent;
    }
    .msg.error { border-color: var(--copper-dark); }
    .msg.success { border-color: var(--green); }
    .msg.info { border-color: var(--teal); background: #E8F4FF; color: var(--teal); }

    /* Disabled input styling */
    .field input:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Smooth button transitions */
    .btn {
      width: 100%;
      margin-top: 0.8rem;
      transition: background 0.2s ease;
    }
    .btn:hover:not(:disabled) {
      background: var(--copper-dark);
    }
    .btn:disabled {
      background: var(--ink-soft);
      cursor: not-allowed;
      opacity: 0.6;
    }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 0.5em;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Back link */
    .back-link {
      margin-top: 1.6rem;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 0.82rem;
    }
    .back-link a { color: var(--ink-soft); text-decoration: none; }
    .back-link a:hover { color: var(--copper-dark); text-decoration: underline; }
  </style>
</head>
<body>

  <div class="auth-shell">
    <div class="auth-card">

      <div class="brand">CABLE<strong>&amp;</strong>NET COURSES</div>

      <div class="wire-divider">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>

      <h1>Log In</h1>
      <p>Access your courses</p>

      <div id="alert" class="msg" role="alert"></div>

      <!-- Sign In form -->
      <form id="loginForm" onsubmit="handleLogin(event)" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            placeholder="your@email.com"
            required
            autocomplete="email"
            aria-label="Email address"
          >
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="••••••••"
            required
            autocomplete="current-password"
            aria-label="Password"
          >
        </div>

        <button type="submit" class="btn btn-primary" id="loginBtn">
          <span id="btnText">Sign In</span>
        </button>
      </form>

      <p class="back-link"><a href="index.html">&larr; Back to Courses</a></p>

    </div>
  </div>

  <!-- Supabase UMD build — exposes global `supabase` object -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <!-- Client config (window.SUPABASE_CONFIG) -->
  <script src="js/config.js?v=9A0E5BF5"></script>

  <!-- Client (sets window.supabaseClient) -->
  <script src="js/supabase-client.js?v=17E25610"></script>

  <script>
    // ============================================
    // ROLE-BASED ROUTING
    // ============================================
    async function getProfile(userId) {
      const { data, error } = await supabaseClient
        .from('profiles')
        .select('role, approved')
        .eq('id', userId)
        .single();
      if (error) {
        console.error('Profile lookup error:', error);
        return null;
      }
      return data;
    }

    // Sync the profile's role from the auth user's signup metadata.
    // Needed because email confirmation means no session exists at signup
    // time, so the profile row may be missing or still defaulted to student.
    async function syncProfileRole(user, profile) {
      const metaRole = user?.user_metadata?.role;
      if (!metaRole) return profile;

      const currentRole = profile?.role;
      if (!profile || currentRole !== metaRole) {
        const { error } = await supabaseClient.rpc('set_profile_role', { p_role: metaRole });
        if (!error) {
          const synced = await getProfile(user.id);
          if (synced) return synced;
        }
      }
      return profile;
    }

    function routeByRole(profile) {
      if (!profile) {
        window.location.replace('index.html');
        return;
      }

      const role = profile.role;
      if (role === 'admin' || role === 'instructor') {
        // Instructors must be approved too (admin approves them)
        window.location.replace(profile.approved ? 'instructor-dashboard.html' : 'index.html');
      } else if (role === 'student') {
        window.location.replace(profile.approved ? 'student-dashboard.html' : 'index.html');
      } else {
        window.location.replace('index.html');
      }
    }

    // ============================================
    // AUTO-LOGIN CHECK
    // ============================================
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (user) {
          let profile = await getProfile(user.id);
          profile = await syncProfileRole(user, profile);
          routeByRole(profile);
        }
      } catch (err) {
        // Show the form normally on error
      }
    });

    // ============================================
    // SIGN IN HANDLER
    // ============================================
    async function handleLogin(event) {
      event.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showAlert('Please enter both email and password', 'error');
        return;
      }

      const loginBtn = document.getElementById('loginBtn');
      const btnText = document.getElementById('btnText');

      loginBtn.disabled = true;
      btnText.innerHTML = '<span class="spinner"></span> Signing in...';

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

        if (error) {
          showAlert(`Login failed: ${error.message}`, 'error');
          loginBtn.disabled = false;
          btnText.textContent = 'Sign In';
          return;
        }

        if (data.user) {
          showAlert(`Welcome back, ${data.user.email}!`, 'success');
          const profile = await getProfile(data.user.id);
          const synced = await syncProfileRole(data.user, profile);
          setTimeout(() => routeByRole(synced), 1200);
        }
      } catch (err) {
        showAlert(`Error: ${err.message}`, 'error');
        loginBtn.disabled = false;
        btnText.textContent = 'Sign In';
      }
    }

    // ============================================
    // UTILITY
    // ============================================
    function showAlert(message, type) {
      const alertEl = document.getElementById('alert');
      alertEl.textContent = message;
      alertEl.className = `msg show ${type}`;
      if (type === 'success') {
        setTimeout(() => alertEl.classList.remove('show'), 3000);
      }
    }

    function clearAlert() {
      const alertEl = document.getElementById('alert');
      alertEl.textContent = '';
      alertEl.className = 'msg';
    }
  </script>
</body>
</html>
