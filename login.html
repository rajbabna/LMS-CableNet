<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — Cable&Net Courses</title>
  <meta name="description" content="Log in to Cable&Net Courses to access your enrolled courses and track your progress.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">

  <!-- Shared theme -->
  <link rel="stylesheet" href="css/style.css">

  <style>
    /* Login-page layout overrides */
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .auth-shell {
      width: 100%;
      max-width: 420px;
    }

    /* Tab bar (Sign In / Create Account) */
    .tab-bar {
      display: flex;
      border-bottom: 1px solid var(--line);
      margin-bottom: 1.4rem;
    }

    .tab-bar button {
      flex: 1;
      padding: 0.7em 0.5em;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--ink-soft);
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }

    .tab-bar button:hover { color: var(--ink); }
    .tab-bar button.active {
      color: var(--copper-dark);
      border-bottom-color: var(--copper);
    }

    /* Message styling */
    .msg {
      border-left: 4px solid transparent;
    }
    .msg.error { border-color: var(--copper-dark); }
    .msg.success { border-color: var(--green); }
    .msg.info { border-color: var(--teal); background: #E8F4FF; color: var(--teal); }

    /* Disabled input styling */
    .field input:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Smooth button transitions */
    .btn {
      width: 100%;
      margin-top: 0.8rem;
      transition: background 0.2s ease;
    }
    .btn:hover:not(:disabled) {
      background: var(--copper-dark);
    }
    .btn:disabled {
      background: var(--ink-soft);
      cursor: not-allowed;
      opacity: 0.6;
    }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 0.5em;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Back link */
    .back-link {
      margin-top: 1.6rem;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 0.82rem;
    }
    .back-link a { color: var(--ink-soft); text-decoration: none; }
    .back-link a:hover { color: var(--copper-dark); text-decoration: underline; }
  </style>
</head>
<body>

  <div class="auth-shell">
    <div class="auth-card">

      <div class="brand">CABLE<strong>&amp;</strong>NET COURSES</div>

      <div class="wire-divider">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>

      <h1>Log In</h1>
      <p>Access your courses</p>

      <!-- Tab bar -->
      <div class="tab-bar" role="tablist">
        <button type="button" id="tab-signin" class="active" role="tab" aria-selected="true" onclick="switchTab('signin')">Sign In</button>
        <button type="button" id="tab-signup" role="tab" aria-selected="false" onclick="switchTab('signup')">Create Account</button>
      </div>

      <div id="alert" class="msg" role="alert"></div>

      <!-- Sign In form -->
      <form id="loginForm" onsubmit="handleLogin(event)" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            placeholder="your@email.com"
            required
            autocomplete="email"
            aria-label="Email address"
          >
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="••••••••"
            required
            autocomplete="current-password"
            aria-label="Password"
          >
        </div>

        <button type="submit" class="btn btn-primary" id="loginBtn">
          <span id="btnText">Sign In</span>
        </button>
      </form>

      <!-- Create Account form -->
      <form id="signupForm" onsubmit="handleSignup(event)" novalidate style="display:none;">
        <div class="field">
          <label for="signup-email">Email</label>
          <input
            type="email"
            id="signup-email"
            placeholder="your@email.com"
            required
            autocomplete="email"
            aria-label="Email address"
          >
        </div>

        <div class="field">
          <label for="signup-password">Password</label>
          <input
            type="password"
            id="signup-password"
            placeholder="At least 6 characters"
            required
            minlength="6"
            autocomplete="new-password"
            aria-label="Create password"
          >
        </div>

        <div class="field">
          <label for="signup-confirm">Confirm Password</label>
          <input
            type="password"
            id="signup-confirm"
            placeholder="Repeat your password"
            required
            autocomplete="new-password"
            aria-label="Confirm password"
          >
        </div>

        <button type="submit" class="btn btn-primary" id="signupBtn">
          <span id="signupBtnText">Create Account</span>
        </button>
      </form>

      <p class="back-link"><a href="index.html">&larr; Back to Courses</a></p>

    </div>
  </div>

  <!-- Supabase UMD build — exposes global `supabase` object -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <!-- Client config (window.SUPABASE_CONFIG) -->
  <script src="js/config.js"></script>

  <!-- Client (sets window.supabaseClient) -->
  <script src="js/supabase-client.js"></script>

  <script>
    // ============================================
    // TAB SWITCHING
    // ============================================
    function switchTab(tab) {
      const isSignin = tab === 'signin';
      document.getElementById('tab-signin').className = isSignin ? 'active' : '';
      document.getElementById('tab-signup').className = isSignin ? '' : 'active';
      document.getElementById('tab-signin').setAttribute('aria-selected', isSignin);
      document.getElementById('tab-signup').setAttribute('aria-selected', !isSignin);
      document.getElementById('loginForm').style.display = isSignin ? '' : 'none';
      document.getElementById('signupForm').style.display = isSignin ? 'none' : '';
      clearAlert();
    }

    // ============================================
    // ROLE-BASED ROUTING
    // ============================================
    async function getProfile(userId) {
      const { data, error } = await supabaseClient
        .from('profiles')
        .select('role, approved')
        .eq('id', userId)
        .single();
      if (error) {
        console.error('Profile lookup error:', error);
        return null;
      }
      return data;
    }

    function routeByRole(profile) {
      if (!profile) {
        window.location.replace('pending.html');
        return;
      }

      const role = profile.role;
      if (role === 'admin' || role === 'instructor') {
        window.location.replace('instructor-dashboard.html');
      } else if (role === 'student') {
        window.location.replace(profile.approved ? 'student-dashboard.html' : 'pending.html');
      } else {
        window.location.replace('index.html');
      }
    }

    // ============================================
    // AUTO-LOGIN CHECK
    // ============================================
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (user) {
          const profile = await getProfile(user.id);
          routeByRole(profile);
        }
      } catch (err) {
        // Show the form normally on error
      }
    });

    // ============================================
    // SIGN IN HANDLER
    // ============================================
    async function handleLogin(event) {
      event.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showAlert('Please enter both email and password', 'error');
        return;
      }

      const loginBtn = document.getElementById('loginBtn');
      const btnText = document.getElementById('btnText');

      loginBtn.disabled = true;
      btnText.innerHTML = '<span class="spinner"></span> Signing in...';

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

        if (error) {
          showAlert(`Login failed: ${error.message}`, 'error');
          loginBtn.disabled = false;
          btnText.textContent = 'Sign In';
          return;
        }

        if (data.user) {
          showAlert(`Welcome back, ${data.user.email}!`, 'success');
          const profile = await getProfile(data.user.id);
          setTimeout(() => routeByRole(profile), 1200);
        }
      } catch (err) {
        showAlert(`Error: ${err.message}`, 'error');
        loginBtn.disabled = false;
        btnText.textContent = 'Sign In';
      }
    }

    // ============================================
    // CREATE ACCOUNT HANDLER
    // ============================================
    async function handleSignup(event) {
      event.preventDefault();

      const email = document.getElementById('signup-email').value.trim();
      const password = document.getElementById('signup-password').value;
      const confirm = document.getElementById('signup-confirm').value;

      if (!email || !password || !confirm) {
        showAlert('Please fill in all fields', 'error');
        return;
      }

      if (password.length < 6) {
        showAlert('Password must be at least 6 characters', 'error');
        return;
      }

      if (password !== confirm) {
        showAlert('Passwords do not match', 'error');
        return;
      }

      const signupBtn = document.getElementById('signupBtn');
      const signupBtnText = document.getElementById('signupBtnText');

      signupBtn.disabled = true;
      signupBtnText.innerHTML = '<span class="spinner"></span> Creating account...';

      try {
        const { data, error } = await supabaseClient.auth.signUp({ email, password });

        if (error) {
          showAlert(`Sign up failed: ${error.message}`, 'error');
          signupBtn.disabled = false;
          signupBtnText.textContent = 'Create Account';
          return;
        }

        if (data.user) {
          showAlert('Account created — waiting for approval.', 'success');
          setTimeout(() => {
            window.location.replace('pending.html');
          }, 1200);
        }
      } catch (err) {
        showAlert(`Error: ${err.message}`, 'error');
        signupBtn.disabled = false;
        signupBtnText.textContent = 'Create Account';
      }
    }

    // ============================================
    // UTILITY
    // ============================================
    function showAlert(message, type) {
      const alertEl = document.getElementById('alert');
      alertEl.textContent = message;
      alertEl.className = `msg show ${type}`;
      if (type === 'success') {
        setTimeout(() => alertEl.classList.remove('show'), 3000);
      }
    }

    function clearAlert() {
      const alertEl = document.getElementById('alert');
      alertEl.textContent = '';
      alertEl.className = 'msg';
    }
  </script>
</body>
</html>
