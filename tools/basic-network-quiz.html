<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basic Network Quiz</title>
<style>
  :root {
    --bg: #EEEBE3;
    --paper: #F7F5EF;
    --ink: #1C2430;
    --ink-soft: #4A5261;
    --line: #D8D3C7;
    --copper: #C2622D;
    --copper-dark: #A24F22;
    --teal: #2C6B75;
    --brown: #6B4A3A;
    --green: #4A7A52;
    --red: #B03A3A;
    --blue: #34576B;
    --font-display: "Archivo Narrow", "Arial Narrow", sans-serif;
    --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", "SF Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .quiz-wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 1.5rem 1rem 2.5rem;
  }
  .quiz-head h1 {
    font-family: var(--font-display);
    font-size: 1.5rem;
    margin: 0;
    letter-spacing: 0.01em;
  }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--copper-dark);
    display: block;
    margin-bottom: 0.5em;
  }
  .quiz-meta {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin: 0.8rem 0 1.2rem;
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .quiz-meta .pill {
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.2em 0.7em;
  }
  .progress-track {
    height: 6px;
    background: var(--line);
    border-radius: 3px;
    overflow: hidden;
    margin: 0 0 1.4rem;
  }
  .progress-fill {
    height: 100%;
    background: var(--teal);
    width: 0%;
    transition: width 0.3s ease;
  }
  .question-block {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 1.6rem;
    margin-bottom: 1.2rem;
  }
  .question-num {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--copper-dark);
    margin-bottom: 0.5rem;
  }
  .question-text {
    font-size: 1.15rem;
    font-weight: 500;
    margin: 0;
  }
  .options {
    display: grid;
    gap: 0.7rem;
  }
  .option {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0.9rem 1.1rem;
    cursor: pointer;
    font-family: var(--font-body);
    font-size: 0.98rem;
    color: var(--ink);
    text-align: left;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .option:hover:not(:disabled) { border-color: var(--teal); }
  .option .letter {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    border-radius: 50%;
    width: 24px;
    height: 24px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .option.correct {
    border-color: var(--green);
    background: #eef4ec;
  }
  .option.correct .letter { background: var(--green); color: #fff; border-color: var(--green); }
  .option.wrong {
    border-color: var(--red);
    background: #fbeeee;
  }
  .option.wrong .letter { background: var(--red); color: #fff; border-color: var(--red); }
  .option:disabled { cursor: default; opacity: 0.9; }
  .feedback {
    display: none;
    margin-top: 1rem;
    padding: 0.9rem 1.1rem;
    border-radius: 8px;
    font-size: 0.92rem;
  }
  .feedback.good { background: #eef4ec; color: #335a3a; border: 1px solid var(--green); }
  .feedback.bad  { background: #fbeeee; color: #7a2f2f; border: 1px solid var(--red); }
  .controls {
    display: flex;
    gap: 0.6rem;
    justify-content: center;
    margin-top: 1.2rem;
  }
  button {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    border: none;
    border-radius: 6px;
    padding: 0.7em 1.3em;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.1s ease;
  }
  button:active { transform: translateY(1px); }
  .btn-primary { background: var(--copper); color: #fff; }
  .btn-primary:hover { background: var(--copper-dark); }
  .btn-ghost { background: var(--line); color: var(--ink); }
  .btn-ghost:hover { background: #cfcbbd; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .start-screen, .results {
    text-align: center;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 2rem;
  }
  .start-screen p, .results p { color: var(--ink-soft); }
  .results h2 { font-family: var(--font-display); font-size: 1.6rem; margin: 0 0 0.6rem; }
  .results .big-score {
    font-family: var(--font-display);
    font-size: 3rem;
    line-height: 1;
    color: var(--teal);
    margin: 0.6rem 0;
  }
  .best-badge {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--green);
    border: 1px solid var(--green);
    border-radius: 999px;
    padding: 0.25em 0.8em;
    margin-top: 0.5rem;
  }
  .sync-note {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--ink-soft);
    margin-top: 1.2rem;
  }
  @media (max-width: 520px) {
    .question-block { padding: 1.2rem; }
  }
</style>
</head>
<body>
<div class="quiz-wrap">
  <div class="quiz-head">
    <span class="eyebrow">Practice · before you enroll</span>
    <h1>Basic Network Quiz</h1>
  </div>
  <div class="quiz-meta">
    <span class="pill" id="cardCount">5 questions</span>
    <span class="pill" id="bestPill">Best: —</span>
  </div>

  <!-- Start screen -->
  <div class="start-screen" id="startScreen">
    <p>Five quick questions to see where you stand before enrolling. No account needed — your best score is saved on your device (and to your Puter account if you sign in).</p>
    <button class="btn-primary" id="startBtn">Start Quiz</button>
  </div>

  <!-- Quiz screen -->
  <div id="quizScreen" style="display:none;">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

    <div class="question-block">
      <div class="question-num" id="questionNum">Question 1 of 5</div>
      <p class="question-text" id="questionText"></p>
    </div>

    <div class="options" id="options"></div>

    <div class="feedback" id="feedback"></div>

    <div class="controls">
      <button class="btn-primary" id="nextBtn" style="display:none;">Next Question →</button>
    </div>
  </div>

  <!-- Results screen -->
  <div class="results" id="resultsScreen" style="display:none;">
    <h2>Quiz Complete</h2>
    <div class="big-score" id="finalScore">0%</div>
    <p id="finalDetail"></p>
    <div id="bestBadge"></div>
    <div class="sync-note" id="syncNote"></div>
    <div style="margin-top:1.4rem; display:flex; gap:0.6rem; justify-content:center; flex-wrap:wrap;">
      <button class="btn-primary" id="retryBtn">Try Again</button>
    </div>
  </div>
</div>

<script src="https://js.puter.com/v2/"></script>
<script>
(function () {
  'use strict';

  // ---- Simple, beginner-friendly questions ----
  var QUESTIONS = [
    {
      q: "What is the internet?",
      options: ["A global network that connects computers and devices around the world", "A type of computer program", "A brand of cable", "A web browser"],
      correct: 0,
      explanation: "The internet is a worldwide network of connected computers and devices sharing information."
    },
    {
      q: "What does Wi-Fi let your devices do?",
      options: ["Connect to the internet without cables", "Charge their battery", "Print documents", "Store files forever"],
      correct: 0,
      explanation: "Wi-Fi is a wireless way for devices like phones and laptops to join a network — no cables needed."
    },
    {
      q: "What does a router do in a home?",
      options: ["Connects your devices to the internet and lets them talk to each other", "Charges your phone", "Makes your screen brighter", "Deletes viruses automatically"],
      correct: 0,
      explanation: "A router links your home devices to your internet service and manages traffic between them."
    },
    {
      q: "What is a web browser?",
      options: ["A cable that carries data", "An app you use to view websites", "A password", "A type of printer"],
      correct: 1,
      explanation: "Browsers like Chrome or Safari are apps that display the pages you visit on the web."
    },
    {
      q: "Why do we use passwords?",
      options: ["To make the internet faster", "To keep our accounts and personal data safe", "To charge devices", "To connect to Wi-Fi"],
      correct: 1,
      explanation: "Passwords protect your accounts so only you (and people you trust) can access them."
    }
  ];

  var STORE_KEY = 'cn_basic_quiz_best';
  var PUTER_KV_KEY = 'cn_basic_quiz_best_score';

  var currentDeck = [];
  var currentIndex = 0;
  var correctCount = 0;

  var el = {
    startScreen: document.getElementById('startScreen'),
    quizScreen: document.getElementById('quizScreen'),
    resultsScreen: document.getElementById('resultsScreen'),
    startBtn: document.getElementById('startBtn'),
    retryBtn: document.getElementById('retryBtn'),
    nextBtn: document.getElementById('nextBtn'),
    questionNum: document.getElementById('questionNum'),
    questionText: document.getElementById('questionText'),
    options: document.getElementById('options'),
    feedback: document.getElementById('feedback'),
    progressFill: document.getElementById('progressFill'),
    cardCount: document.getElementById('cardCount'),
    bestPill: document.getElementById('bestPill'),
    finalScore: document.getElementById('finalScore'),
    finalDetail: document.getElementById('finalDetail'),
    bestBadge: document.getElementById('bestBadge'),
    syncNote: document.getElementById('syncNote')
  };

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function localBest() {
    try { return parseInt(localStorage.getItem(STORE_KEY) || '0', 10); }
    catch (e) { return 0; }
  }
  function setLocalBest(v) {
    try { localStorage.setItem(STORE_KEY, String(v)); } catch (e) {}
  }

  function saveBest(score) {
    setLocalBest(score);
    if (window.puter && puter.kv && puter.isSignedIn()) {
      puter.kv.set(PUTER_KV_KEY, score).catch(function () {});
    }
  }

  function loadBest(cb) {
    var local = localBest();
    if (window.puter && puter.kv && puter.isSignedIn()) {
      puter.kv.get(PUTER_KV_KEY)
        .then(function (v) {
          var cloud = parseInt(v || '0', 10);
          cb(Math.max(local, cloud));
        })
        .catch(function () { cb(local); });
    } else {
      cb(local);
    }
  }

  function updateBestPill() {
    el.bestPill.textContent = 'Best: ' + localBest() + '%';
  }

  function startQuiz(deck) {
    currentDeck = deck;
    currentIndex = 0;
    correctCount = 0;
    el.startScreen.style.display = 'none';
    el.resultsScreen.style.display = 'none';
    el.quizScreen.style.display = 'block';
    el.cardCount.textContent = deck.length + ' questions';
    renderQuestion();
  }

  function renderQuestion() {
    if (currentIndex >= currentDeck.length) {
      showResults();
      return;
    }
    var item = currentDeck[currentIndex];
    el.questionNum.textContent = 'Question ' + (currentIndex + 1) + ' of ' + currentDeck.length;
    el.questionText.textContent = item.q;
    el.progressFill.style.width = ((currentIndex / currentDeck.length) * 100) + '%';

    el.feedback.style.display = 'none';
    el.feedback.className = 'feedback';
    el.feedback.innerHTML = '';
    el.nextBtn.style.display = 'none';

    var letters = ['A', 'B', 'C', 'D'];
    el.options.innerHTML = '';
    item.options.forEach(function (opt, i) {
      var btn = document.createElement('button');
      btn.className = 'option';
      btn.type = 'button';
      btn.innerHTML = '<span class="letter">' + letters[i] + '</span><span>' + opt + '</span>';
      btn.addEventListener('click', function () { selectAnswer(i, btn); });
      el.options.appendChild(btn);
    });
  }

  function selectAnswer(index, btn) {
    var item = currentDeck[currentIndex];
    var allBtns = el.options.querySelectorAll('.option');

    // Lock all options
    allBtns.forEach(function (b) { b.disabled = true; });

    var isCorrect = index === item.correct;

    // Highlight correct + wrong
    allBtns.forEach(function (b, i) {
      if (i === item.correct) b.classList.add('correct');
      if (i === index && !isCorrect) b.classList.add('wrong');
    });

    if (isCorrect) correctCount++;

    el.feedback.style.display = 'block';
    el.feedback.className = 'feedback ' + (isCorrect ? 'good' : 'bad');
    el.feedback.innerHTML = '<strong>' + (isCorrect ? 'Correct!' : 'Not quite.') + '</strong> ' + item.explanation;

    el.nextBtn.style.display = 'inline-block';
  }

  function showResults() {
    el.quizScreen.style.display = 'none';
    el.resultsScreen.style.display = 'block';

    var total = currentDeck.length;
    var score = Math.round((correctCount / total) * 100);
    el.finalScore.textContent = score + '%';
    el.finalDetail.textContent = 'You answered ' + correctCount + ' of ' + total + ' correctly.';

    var best = Math.max(localBest(), score);
    saveBest(best);
    updateBestPill();

    if (score === 100) {
      el.bestBadge.innerHTML = '<span class="best-badge">★ Perfect — ready to enroll!</span>';
    } else if (best === score && score > 0) {
      el.bestBadge.innerHTML = '<span class="best-badge">New best score</span>';
    } else {
      el.bestBadge.innerHTML = '';
    }

    el.syncNote.textContent = (window.puter && puter.isSignedIn())
      ? 'Saved to your Puter account.'
      : 'Saved on this device. Log in with Puter to keep your best score on any device.';
  }

  // ---- Wire up ----
  el.startBtn.addEventListener('click', function () { startQuiz(shuffle(QUESTIONS)); });
  el.retryBtn.addEventListener('click', function () { startQuiz(shuffle(QUESTIONS)); });
  el.nextBtn.addEventListener('click', function () {
    currentIndex++;
    renderQuestion();
  });

  // Init
  updateBestPill();
  loadBest(function (best) {
    if (best > 0) setLocalBest(best);
    updateBestPill();
  });
})();
</script>
</body>
</html>
