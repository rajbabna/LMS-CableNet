<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Pack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEEBE3;
    --paper: #F7F5EF;
    --ink: #1C2430;
    --ink-soft: #4A5261;
    --line: #D8D3C7;
    --copper: #C2622D;
    --copper-dark: #A24F22;
    --teal: #2C6B75;
    --green: #4A7A52;
    --red: #B03A3A;
    --font-display: "Archivo Narrow", "Arial Narrow", sans-serif;
    --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", "SF Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .pack-wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 1.5rem 1rem 3rem;
  }
  .pack-head h1 {
    font-family: var(--font-display);
    font-size: 1.6rem;
    margin: 0;
    letter-spacing: 0.01em;
  }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--copper-dark);
    display: block;
    margin-bottom: 0.5em;
  }
  .pack-meta {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin: 0.8rem 0 1.4rem;
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
  }
  .pack-meta .pill {
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.2em 0.7em;
  }
  .section-title {
    font-family: var(--font-display);
    font-size: 1.15rem;
    margin: 2rem 0 0.8rem;
    padding-top: 1.4rem;
    border-top: 1px dashed var(--line);
  }

  /* ---- Study notes ---- */
  .notes-body {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 1.6rem 1.8rem;
  }
  .notes-body h2 { font-size: 1.05rem; font-family: var(--font-display); margin: 1.4rem 0 0.5rem; }
  .notes-body h2:first-child { margin-top: 0; }
  .notes-body p { color: var(--ink-soft); margin: 0 0 0.9rem; }
  .notes-body img { max-width: 100%; height: auto; display: block; margin: 0.8rem 0 1rem; border: 1px solid var(--line); border-radius: 10px; }
  .notes-body ul, .notes-body ol { padding-left: 1.4rem; margin: 0 0 0.9rem; color: var(--ink-soft); }
  .notes-body li { margin-bottom: 0.3rem; }
  .notes-body kbd, .notes-body code {
    font-family: var(--font-mono);
    font-size: 0.82em;
    background: #ece9dd;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 0.1em 0.35em;
  }
  .notes-body table { border-collapse: collapse; width: 100%; margin: 0 0 1rem; font-size: 0.92rem; }
  .notes-body th, .notes-body td { border: 1px solid var(--line); padding: 0.45rem 0.7rem; text-align: left; }
  .notes-body th { background: #efece2; font-family: var(--font-mono); font-size: 0.78rem; }

  /* ---- Quiz (reuses the online quiz look) ---- */
  .quiz-strip {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 1.6rem;
    margin-bottom: 1.2rem;
  }
  .progress-track {
    height: 6px;
    background: var(--line);
    border-radius: 3px;
    overflow: hidden;
    margin: 0 0 1.4rem;
  }
  .progress-fill {
    height: 100%;
    background: var(--teal);
    width: 0%;
    transition: width 0.3s ease;
  }
  .question-num {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--copper-dark);
    margin-bottom: 0.5rem;
  }
  .question-text {
    font-size: 1.15rem;
    font-weight: 500;
    margin: 0;
  }
  .options {
    display: grid;
    gap: 0.7rem;
    margin-top: 1.2rem;
  }
  .option {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0.9rem 1.1rem;
    cursor: pointer;
    font-family: var(--font-body);
    font-size: 0.98rem;
    color: var(--ink);
    text-align: left;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .option:hover:not(:disabled) { border-color: var(--teal); }
  .option .letter {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    border-radius: 50%;
    width: 24px;
    height: 24px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .option.correct { border-color: var(--green); background: #eef4ec; }
  .option.correct .letter { background: var(--green); color: #fff; border-color: var(--green); }
  .option.wrong { border-color: var(--red); background: #fbeeee; }
  .option.wrong .letter { background: var(--red); color: #fff; border-color: var(--red); }
  .option:disabled { cursor: default; opacity: 0.9; }
  .feedback {
    display: none;
    margin-top: 1rem;
    padding: 0.9rem 1.1rem;
    border-radius: 8px;
    font-size: 0.92rem;
  }
  .feedback.good { background: #eef4ec; color: #335a3a; border: 1px solid var(--green); }
  .feedback.bad  { background: #fbeeee; color: #7a2f2f; border: 1px solid var(--red); }
  .controls {
    display: flex;
    gap: 0.6rem;
    justify-content: center;
    margin-top: 1.2rem;
    flex-wrap: wrap;
  }
  button {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    border: none;
    border-radius: 6px;
    padding: 0.7em 1.3em;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.1s ease;
  }
  button:active { transform: translateY(1px); }
  .btn-primary { background: var(--copper); color: #fff; }
  .btn-primary:hover { background: var(--copper-dark); }
  .btn-ghost { background: var(--line); color: var(--ink); }
  .btn-ghost:hover { background: #cfcbbd; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .results {
    text-align: center;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 2rem;
  }
  .results h2 { font-family: var(--font-display); font-size: 1.6rem; margin: 0 0 0.6rem; }
  .results p { color: var(--ink-soft); }
  .big-score {
    font-family: var(--font-display);
    font-size: 3rem;
    line-height: 1;
    color: var(--teal);
    margin: 0.6rem 0;
  }
  .best-badge {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--green);
    border: 1px solid var(--green);
    border-radius: 999px;
    padding: 0.25em 0.8em;
    margin-top: 0.5rem;
  }
  .sync-note {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--ink-soft);
    margin-top: 1.2rem;
  }
  .sync-form {
    display: grid;
    gap: 0.5rem;
    max-width: 340px;
    margin: 0.8rem auto 0;
    text-align: left;
  }
  .sync-form input {
    font-family: var(--font-mono);
    font-size: 0.85rem;
    padding: 0.55em 0.8em;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
    width: 100%;
  }
  .sync-form input:focus { outline: none; border-color: var(--teal); }
  .mobile-hint {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--ink-soft);
    background: #efece2;
    border: 1px dashed var(--line);
    border-radius: 8px;
    padding: 0.7rem 1rem;
    margin-bottom: 1.2rem;
  }
  @media (max-width: 520px) {
    .quiz-strip, .notes-body { padding: 1.2rem; }
  }
</style>
</head>
<body>
<div class="pack-wrap">
  <div class="pack-head">
    <span class="eyebrow">Study pack</span>
    <h1 id="packTitle">Study Pack</h1>
  </div>
  <div class="pack-meta">
    <span class="pill" id="packMeta">Offline-ready</span>
    <span class="pill" id="progressPill">Not started</span>
    <span class="pill" id="bestPill">Best: —</span>
  </div>

  <div class="mobile-hint" id="offlineHint" style="display:none;">
    📶 Offline mode — progress is saved on this device and will sync to your course when you're back online.
  </div>

  <!-- STUDY NOTES -->
  <div id="notesSection">
    <h2 class="section-title">Study notes</h2>
    <div class="notes-body" id="notesBody"></div>
  </div>

  <!-- QUIZ -->
  <h2 class="section-title">Test your knowledge</h2>
  <div id="quizZone">
    <div class="quiz-strip" id="quizScreen">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="question-num" id="questionNum">Question 1 of 0</div>
      <p class="question-text" id="questionText"></p>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <div class="controls">
        <button class="btn-primary" id="nextBtn" style="display:none;">Next Question →</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
  'use strict';

  // ============================================================
  // EMBEDDED PACK DATA — a generator fills these before shipping.
  // The quiz question shape mirrors get_module_quiz_questions()
  // (id / question / options / correct_index / explanation) so a
  // pack embeds exactly what the online quiz deals from.
  // ============================================================
  var STUDY_PACK = {
    "moduleId": 10,
    "title": "Module 2: Cabling Standards & Cable Types",
    "version": "1.0",
    "note": "Network Foundations — Cabling & Infrastructure — module 2. Offline study pack: read the notes, take the quiz, then save your best score to the course while online.",
    "notes": {
      "sections": [
        {
          "title": "Learning Objectives",
          "html": "<ul><li>Distinguish Cat5e, Cat6, and Cat6A cable specifications</li>\n<li>Explain the difference between UTP and STP cable</li>\n<li>Describe fiber optic cable at a basic level</li>\n<li>Reference the EIA/TIA-568 structured cabling standard</li>\n<li>Explain why twisted pairs cancel electromagnetic interference</li>\n</ul>"
        },
        {
          "title": "Lecture Notes (9:00–10:30)",
          "html": "<h3>The Cable Hierarchy</h3>\nA network cable is a <strong>Layer 1 (Physical)</strong> medium — it carries electrical or\nlight signals between devices. Three families dominate:\n<table><thead><tr><th>Family</th><th>Medium</th><th>Typical use</th><th>Reach limit</th></tr></thead><tbody><tr><td>Copper UTP</td><td>Twisted copper pairs</td><td>Office/home LANs</td><td>~100 m</td></tr><tr><td>Copper STP</td><td>Twisted pairs + foil/braid</td><td>Noisy industrial environments</td><td>~100 m</td></tr><tr><td>Fiber optic</td><td>Glass/plastic core</td><td>Backbones, WAN, data centers</td><td>100 m – 40 km+</td></tr><tr><td>Coaxial</td><td>Central conductor + shield</td><td>Legacy cable TV, older LANs</td><td>~500 m</td></tr></tbody></table>\n<strong>Why twisted pairs?</strong> Twisting the two wires of a circuit **cancels\nelectromagnetic interference (EMI)** from adjacent pairs and the environment.\nThis is what lets Cat5e/Cat6 run fast without each pair radiating into\nanother — untwist the wires and the crosstalk/EMI returns.\n<h3>Cable Categories</h3>\n<table><thead><tr><th>Category</th><th>Max Speed</th><th>Max Distance</th><th>Notes</th></tr></thead><tbody><tr><td>Cat5e</td><td>1 Gbps</td><td>100m</td><td>Still common, budget option</td></tr><tr><td>Cat6</td><td>1–10 Gbps</td><td>55–100m</td><td>Best balance of cost/performance</td></tr><tr><td>Cat6A</td><td>10 Gbps</td><td>100m</td><td>Thicker, better shielding</td></tr><tr><td>Cat8</td><td>40 Gbps (≤30 m)</td><td>30m</td><td>Data-center short links</td></tr></tbody></table>\n<strong>Installer rule:</strong> residential/office → Cat5e or Cat6; new structured\ninstalls today → <strong>Cat6A</strong> is the safe future-proof choice; Cat8 is niche\n(very short switch-to-server runs only).\n<h3>UTP vs STP</h3>\n<ul><li><strong>UTP</strong> (Unshielded Twisted Pair) — standard for most office/home use,</li>\n</ul> cheaper, twisting alone reduces interference\n<ul><li><strong>STP</strong> (Shielded Twisted Pair) — added foil/braid shielding, used near</li>\n</ul> heavy electrical interference (factories, near power lines)\n<h3>Fiber Optic (overview only — not hands-on this course)</h3>\n<ul><li>Uses light instead of electricity</li>\n<li>Immune to electrical interference, much longer distances</li>\n<li><strong>Multi-mode</strong> (OM2/OM3/OM4) = short high-speed links inside a building</li>\n<li><strong>Single-mode</strong> (OS2) = long-haul WAN (10s of km)</li>\n<li>More expensive, requires specialized tools to terminate</li>\n</ul>\n<h3>Standards &amp; Structured Cabling</h3>\n<ul><li><strong>EIA/TIA-568</strong> governs commercial building cabling in most of the world</li>\n<li>&quot;Structured cabling&quot; = planned, labeled, standardized cable runs rather</li>\n</ul> than ad-hoc wiring — critical for maintainability in real buildings\n<ul><li><strong>Safety/code:</strong> cable run above ceilings must be <strong>plenum-rated</strong></li>\n</ul> (low-smoke, low-flame jacket); never run parallel alongside mains power\n for long distances (induction noise)"
        },
        {
          "title": "Lab 2A: Cable Identification & Inspection (10:45–11:30)",
          "html": "<ul><li>Examine different cable types (Cat5e, Cat6, Cat6A samples)</li>\n<li>Feel the physical difference between UTP and STP</li>\n<li>Measure jacket diameter, count twists per inch</li>\n<li>Identify connector types on hand (RJ45, keystone, fiber LC/SC)</li>\n<li>Read the jacket printing: category rating, plenum/fire rating, AWG</li>\n</ul>"
        },
        {
          "title": "Lab 2B: Cable Anatomy Video (11:30–12:30)",
          "html": "<ul><li>Cross-section view of a twisted pair cable</li>\n<li>Discuss why twisting matters (cancels electromagnetic interference)</li>\n<li>Discuss jacket materials and what they protect against</li>\n<li>Test the interference idea: hold wires near a speaker/EM source and</li>\n</ul> observe — twisted vs untwisted difference"
        },
        {
          "title": "Afternoon Design Task (1:15–2:15)",
          "html": "<strong>Scenario:</strong> &quot;A small office needs 50 network drops.&quot;\n<ul><li>What cable category should they recommend, and why?</li>\n<li>How many cables/meters are needed given the office layout?</li>\n<li>Discuss trade-offs: budget Cat5e vs future-proof Cat6A</li>\n<li>What standard documents a &quot;structured&quot; plan, and why label it?</li>\n<li>Which would you run to the far building: copper or fiber, and why?</li>\n</ul>"
        },
        {
          "title": "Check for Understanding",
          "html": "<ul><li>What does &quot;UTP&quot; stand for and when would you choose STP instead?</li>\n<li>Which cable category would you recommend for a 10 Gbps office network?</li>\n<li>What standard governs commercial cabling installs?</li>\n<li>Why are copper pairs twisted (electrical reason)?</li>\n</ul>"
        },
        {
          "title": "Home Assignment",
          "html": "<ul><li>Memorize the RJ45 pin order (colors 1–8) ahead of next week</li>\n<li>Watch the RJ45 tutorial video (5 min), twice</li>\n<li>Find a damaged cable at home or school to bring in</li>\n<li>Read: docs/resources/cabling/cable-types-and-categories.md</li>\n</ul>"
        }
      ]
    },
    "quiz": {
      "questions": [
        {
          "id": 1,
          "question": "Why are copper pairs twisted inside a network cable?",
          "options": [
            "To make the cable flexible",
            "To cancel electromagnetic interference (EMI)",
            "To reduce the cost of copper",
            "To increase the cable's length limit"
          ],
          "correct_index": 1,
          "explanation": "Twisting cancels EMI/crosstalk from adjacent pairs and the environment (§1, §Key Takeaways)."
        },
        {
          "id": 2,
          "question": "Which UTP category supports 10 Gbps up to 100 m and is the recommended future-proof choice for new structured installs?",
          "options": [
            "Cat5e",
            "Cat6",
            "Cat6a",
            "Cat8"
          ],
          "correct_index": 2,
          "explanation": "Cat6a: 10 Gbps at 100 m, 500 MHz, recommended future-proof choice (§2)."
        },
        {
          "id": 3,
          "question": "A cable with a foil/braid shield around the twisted pairs is called:",
          "options": [
            "UTP",
            "STP",
            "Coaxial",
            "Fiber"
          ],
          "correct_index": 1,
          "explanation": "STP (Shielded Twisted Pair) (§1, module §UTP vs STP)."
        },
        {
          "id": 4,
          "question": "What is the practical reach limit of copper UTP for LAN runs?",
          "options": [
            "10 m",
            "100 m",
            "500 m",
            "40 km"
          ],
          "correct_index": 1,
          "explanation": "~100 m (§1 cable hierarchy table)."
        },
        {
          "id": 5,
          "question": "Which standard governs commercial building cabling?",
          "options": [
            "IEEE 802.3",
            "ISO 9001",
            "EIA/TIA-568",
            "RFC 1918"
          ],
          "correct_index": 2,
          "explanation": "EIA/TIA-568 (§6 in resource, module §Standards)."
        },
        {
          "id": 6,
          "question": "Which cable family is immune to electrical interference and best for runs over 100 m between buildings?",
          "options": [
            "UTP Cat5e",
            "STP Cat6",
            "Fiber optic",
            "Coaxial"
          ],
          "correct_index": 2,
          "explanation": "Fiber: immune to EMI, 100 m – 40 km+ (§1)."
        }
      ]
    }
  };

  // ============================================================
  // SYNC CONFIG
  // Filled by the generator with the course project's URL + key so
  // the Supabase CDN client can call submit_quiz_score. Leave
  // enabled=false for a pure-offline pack build.
  // ============================================================
  var SYNC = {
  enabled: true,
  supabaseUrl: 'https://mantjzpfhikezztonrga.supabase.co',
  supabaseAnonKey: 'sb_publishable_t5GiOxBzTlWkRDR0pS0f0g_L1JhYfI0',
  rpc: 'submit_quiz_score'
};

  // ---- Element refs ----
  var el = {
    title: document.getElementById('packTitle'),
    meta: document.getElementById('packMeta'),
    progressPill: document.getElementById('progressPill'),
    bestPill: document.getElementById('bestPill'),
    offlineHint: document.getElementById('offlineHint'),
    notesBody: document.getElementById('notesBody'),
    quizZone: document.getElementById('quizZone'),
    progressFill: document.getElementById('progressFill'),
    questionNum: document.getElementById('questionNum'),
    questionText: document.getElementById('questionText'),
    options: document.getElementById('options'),
    feedback: document.getElementById('feedback'),
    nextBtn: document.getElementById('nextBtn')
  };

  function $(id) { return document.getElementById(id); }

  // ---- Pack header ----
  function renderHead() {
    document.title = STUDY_PACK.title;
    el.title.textContent = STUDY_PACK.title;
    el.meta.textContent = 'v' + STUDY_PACK.version + ' · ' + STUDY_PACK.quiz.questions.length + ' questions';
    renderNotes();
    renderProgressPills();
  }

  // ---- Study notes ----
  function renderNotes() {
    var sections = (STUDY_PACK.notes && STUDY_PACK.notes.sections) || [];
    if (!sections.length) {
      el.notesBody.innerHTML = '<p style="color:var(--ink-soft)">No study notes embedded yet.</p>';
      return;
    }
    var html = '';
    sections.forEach(function (s) {
      html += s.title ? '<h2>' + escapeHtml(s.title) + '</h2>' : '';
      html += s.html || '';
    });
    el.notesBody.innerHTML = html;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ---- Progress (local + local best) ----
  function storageKey() { return 'study-pack:' + STUDY_PACK.moduleId; }
  function bestKey() { return 'study-pack-best:' + STUDY_PACK.moduleId; }

  function readProgress() {
    try { var raw = localStorage.getItem(storageKey()); return raw ? JSON.parse(raw) : null; }
    catch (e) { return null; }
  }
  function writeProgress(p) {
    try { localStorage.setItem(storageKey(), JSON.stringify(p)); } catch (e) {}
  }
  function localBest() {
    try { return parseInt(localStorage.getItem(bestKey()) || '0', 10); } catch (e) { return 0; }
  }
  function setLocalBest(v) {
    try { localStorage.setItem(bestKey(), String(v)); } catch (e) {}
  }

  function renderProgressPills() {
    var best = localBest();
    el.bestPill.textContent = 'Best: ' + (best > 0 ? best + '%' : '—');
    var p = readProgress();
    if (p && p.completedAt) {
      el.progressPill.textContent = 'Completed ' + (p.finalScore || 0) + '%' + (p.syncedToCloud ? ' · ✓ synced' : '');
    } else {
      el.progressPill.textContent = 'Not started';
    }
  }

  // ---- Quiz engine (one question at a time, immediate feedback) ----
  var questions = (STUDY_PACK.quiz && STUDY_PACK.quiz.questions) || [];
  var idx = 0;
  var correct = 0;
  var responses = [];
  var answered = false;

  function mostRecentAttempt() {
    var p = readProgress();
    return p && p.responses ? p.responses.length : 0;
  }

  function alreadyAnswered(qid) {
    var p = readProgress();
    if (!p || !p.responses) return null;
    for (var i = 0; i < p.responses.length; i++) {
      if (p.responses[i].questionId === qid) return p.responses[i];
    }
    return null;
  }

  function renderQuestion(q, saved) {
    answered = !!saved;
    if (saved) correct++;

    el.questionNum.textContent = 'Question ' + (idx + 1) + ' of ' + questions.length;
    el.questionText.textContent = q.question;
    el.progressFill.style.width = (idx / questions.length * 100) + '%';

    var opts = '';
    q.options.forEach(function (o, i) {
      var cls = 'option';
      var letter = String.fromCharCode(65 + i);
      var checked = saved ? ' checked="checked"' : '';
      var disabled = saved ? ' disabled' : '';
      var mark = '';
      if (saved) {
        if (i === q.correct_index) { cls += ' correct'; mark = ' ✓'; }
        else if (saved.selectedIndex === i) { cls += ' wrong'; mark = ' ✗'; }
      }
      opts += '<button type="button" class="' + cls + '" data-i="' + i + '"' + disabled + '>'
            + '<span class="letter">' + letter + '</span><span>' + escapeHtml(o) + mark + '</span></button>';
    });
    el.options.innerHTML = opts;
    el.options.querySelectorAll('.option').forEach(function (b) {
      b.addEventListener('click', function () { onChoose(parseInt(b.getAttribute('data-i'), 10)); });
    });

    if (saved) {
      showFeedback(saved.selectedIndex === q.correct_index, q);
      el.nextBtn.style.display = 'inline-block';
      el.nextBtn.textContent = (idx === questions.length - 1) ? 'Finish Quiz' : 'Next Question →';
    } else {
      el.feedback.style.display = 'none';
      el.nextBtn.style.display = 'none';
    }
  }

  function onChoose(i) {
    if (answered) return;
    var q = questions[idx];
    answered = true;
    var isCorrect = i === q.correct_index;
    if (isCorrect) correct++;

    el.options.querySelectorAll('.option').forEach(function (b) {
      var k = parseInt(b.getAttribute('data-i'), 10);
      b.disabled = true;
      if (k === q.correct_index) b.classList.add('correct');
      else if (k === i) b.classList.add('wrong');
    });

    // Persist per-question response immediately (offline-safe).
    responses.push({ questionId: q.id || (idx + 1), selectedIndex: i, isCorrect: isCorrect });
    var subs = readProgress() || { moduleId: STUDY_PACK.moduleId, responses: [] };
    subs.responses.push(responses[responses.length - 1]);
    subs.startedAt = subs.startedAt || new Date().toISOString();
    writeProgress(subs);

    showFeedback(isCorrect, q);
    el.nextBtn.style.display = 'inline-block';
    el.nextBtn.textContent = (idx === questions.length - 1) ? 'Finish Quiz' : 'Next Question →';
  }

  function showFeedback(isCorrect, q) {
    var f = el.feedback;
    f.className = 'feedback ' + (isCorrect ? 'good' : 'bad');
    f.textContent = isCorrect ? 'Correct ✓' : (q.explanation || 'Incorrect');
    f.style.display = 'block';
  }

  function next() {
    idx++;
    if (idx >= questions.length) { finishQuiz(); return; }
    var q = questions[idx];
    renderQuestion(q, alreadyAnswered(q.id || (idx + 1)));
  }

  // ---- Finish ----
  var finished = false;
  function finishQuiz() {
    if (finished) return;
    finished = true;
    var score = Math.round(correct / questions.length * 100);

    var prog = readProgress() || { moduleId: STUDY_PACK.moduleId, responses: [] };
    prog.finalScore = score;
    prog.completedAt = new Date().toISOString();
    prog.syncedToCloud = false;
    writeProgress(prog);

    var prevBest = localBest();
    if (score > prevBest) setLocalBest(score);

    renderProgressPills();
    renderResult(score, true);
    syncIfOnline(score);
  }

  function renderResult(score, allowRetake) {
    var best = localBest();
    var p = readProgress();
    el.quizZone.innerHTML =
      '<div class="results">' +
        '<h2>Quiz Complete</h2>' +
        '<div class="big-score">' + score + '%</div>' +
        '<p>' + score + ' correct out of ' + questions.length + '.</p>' +
        (best > 0 ? '<span class="best-badge">Best: ' + best + '%</span>' : '') +
        '<div class="sync-note" id="syncNote"></div>' +
        '<div class="controls">' +
          (allowRetake ? '<button class="btn-primary" id="retryBtn">Try Again</button>' : '') +
          '<button class="btn-ghost" id="backToNotesBtn">Read Notes</button>' +
        '</div>' +
      '</div>';
    var syncNote = $('syncNote');
    if (p) {
      if (p.syncedToCloud) {
        syncNote.textContent = '✓ Saved to your course.';
      } else if (navigator.onLine && SYNC.enabled) {
        syncNote.textContent = 'Saved on this device.';
        renderSignInForm(score);
      } else {
        syncNote.textContent = 'Saved on this device. When online, choose "Save to Cloud".';
        renderEndBtn();
      }
    }
    $('retryBtn').addEventListener('click', retake);
    $('backToNotesBtn').addEventListener('click', function () {
      document.getElementById('notesBody').scrollIntoView({ behavior: 'smooth' });
    });
    el.progressFill.style.width = '100%';
  }

  function retake() {
    // Fresh attempt: keep local best, clear in-progress responses cache.
    writeProgress({ moduleId: STUDY_PACK.moduleId, responses: [] });
    idx = 0; correct = 0; responses = []; finished = false;
    el.quizZone.innerHTML = earlierMarkup();
    wireQuiz();
    renderQuestion(questions[0], null);
  }

  // Rebuild the quiz DOM after a retake wiped the results markup.
  function earlierMarkup() {
    return '<div class="quiz-strip" id="quizScreen">' +
      '<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>' +
      '<div class="question-num" id="questionNum"></div>' +
      '<p class="question-text" id="questionText"></p>' +
      '<div class="options" id="options"></div>' +
      '<div class="feedback" id="feedback"></div>' +
      '<div class="controls"><button class="btn-primary" id="nextBtn" style="display:none;">Next Question →</button></div>' +
    '</div>';
  }

  function wireQuiz() {
    el.progressFill = $('progressFill');
    el.questionNum = $('questionNum');
    el.questionText = $('questionText');
    el.options = $('options');
    el.feedback = $('feedback');
    el.nextBtn = $('nextBtn');
    el.nextBtn.addEventListener('click', next);
  }

  // ---- Offline indicator ----
  function updateOnline() {
    el.offlineHint.style.display = navigator.onLine ? 'none' : 'block';
  }

  // ---- Cloud sync (best effort) ----
  // Only fires when SYNC.enabled and online. The results screen offers
  // "Save to Cloud": if no session exists (e.g. the pack was downloaded and
  // opened from a local file), a compact sign-in form appears so the student
  // can log in with their course account (email/password) and then sync.
  // Never blocks the quiz.
  var syncClient = null;
  function ensureClient() {
    if (!SYNC.enabled || !window.supabase) return null;
    if (!syncClient) {
      try {
        syncClient = window.supabase.createClient(SYNC.supabaseUrl, SYNC.supabaseAnonKey);
      } catch (e) { return null; }
    }
    return syncClient;
  }

  function currentUser() {
    var c = ensureClient();
    return c ? c.auth.getUser() : Promise.resolve({ data: { user: null } });
  }

  function syncIfOnline(score) {
    if (!SYNC.enabled || !navigator.onLine) return;
    currentUser().then(function (r) {
      if (r.error || !r.data.user) {
        renderSignInForm(score);
        return;
      }
      return submitScore(score);
    }).catch(function () { renderSignInForm(score); });
  }

  function submitScore(score) {
    var c = ensureClient();
    if (!c) { showSyncStatus('Sync is not configured for this pack.'); return; }
    return c.rpc(SYNC.rpc, { p_module_id: STUDY_PACK.moduleId, p_score: score })
      .then(function (res) {
        if (res.error) { showSyncStatus('Could not sync now — ' + res.error.message); return false; }
        markSynced();
        return true;
      })
      .catch(function (err) {
        showSyncStatus('Sync failed — ' + (err && err.message ? err.message : 'offline'));
        return false;
      });
  }

  // Inline email/password sign-in on the results panel, then syncs on success.
  function renderSignInForm(score) {
    var note = $('syncNote');
    if (!note) return;
    note.innerHTML =
      '<span>Saved on this device. Sign in to your course account to sync your best score.</span>' +
      '<form class="sync-form" id="syncForm" onsubmit="return false;">' +
        '<input type="email" id="syncEmail" placeholder="Course email" autocomplete="username" required>' +
        '<input type="password" id="syncPass" placeholder="Password" autocomplete="current-password" required>' +
        '<button class="btn-ghost" type="submit" id="syncGoBtn">Sign in &amp; sync</button>' +
      '</form>' +
      '<button class="btn-ghost" id="syncLaterBtn" style="margin-top:0.6rem;">Sync later</button>';
    var form = $('syncForm');
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var email = $('syncEmail').value.trim();
      var pass = $('syncPass').value;
      var go = $('syncGoBtn');
      go.disabled = true;
      go.textContent = 'Syncing…';
      var c = ensureClient();
      if (!c) { showSyncStatus('Sync is not configured for this pack.'); return; }
      c.auth.signInWithPassword({ email: email, password: pass })
        .then(function (res) {
          if (res.error) {
            showSyncStatus('Sign-in failed — ' + res.error.message);
            go.disabled = false;
            go.textContent = 'Sign in & sync';
            return;
          }
          submitScore(score);
        })
        .catch(function (err) {
          showSyncStatus('Sign-in failed — ' + (err && err.message ? err.message : 'try again'));
          go.disabled = false;
          go.textContent = 'Sign in & sync';
        });
    });
    $('syncLaterBtn').addEventListener('click', function () {
      note.textContent = 'Saved on this device. Choose "Save to Cloud" when you are back online.';
    });
    renderEndBtn();
  }

  function renderEndBtn() {
    var cur = $('saveCloudBtn');
    if (cur) return;
    var note = $('syncNote');
    if (!note) return;
    // A "Save to Cloud" entry that reappears for already-finished packs.
    note.innerHTML = note.innerHTML +
      '<br><button class="btn-ghost" id="saveCloudBtn" style="margin-top:0.5rem;">Save to Cloud</button>';
    $('saveCloudBtn').addEventListener('click', function () {
      var p = readProgress();
      var s = p && p.finalScore != null ? p.finalScore : 0;
      syncIfOnline(s);
    });
  }

  function markSynced() {
    var p = readProgress() || {};
    p.syncedToCloud = true;
    writeProgress(p);
    renderProgressPills();
    showSyncStatus('✓ Saved to your course.');
  }

  function showSyncStatus(msg) {
    var note = $('syncNote');
    if (note) {
      var btn = $('saveCloudBtn');
      if (btn && btn.parentNode === note) btn.remove();
      note.textContent = msg;
    }
  }

  // ---- Init ----
  function boot() {
    renderHead();
    updateOnline();
    window.addEventListener('online', updateOnline);
    window.addEventListener('offline', updateOnline);

    if (!questions.length) {
      el.quizZone.innerHTML =
        '<div class="results"><h2>No questions yet</h2>' +
        '<p>This study pack has no embedded quiz questions. Check back when the pack is updated.</p></div>';
      return;
    }

    // Resume: continue from the first unanswered question in the saved
    // progress; previously answered responses already count toward the score.
    // A question that was saved as answered but hasn't been re-rendered yet
    // is treated as correct-if-was-correct (responses are only persisted on
    // selection). We tally them now to keep the running score honest.
    var p = readProgress();
    if (p && p.responses && p.responses.length) {
      var seenCorrect = 0;
      p.responses.forEach(function (r) {
        if (r.isCorrect) seenCorrect++;
        var q = questions[idx];
        if (q && q.id === r.questionId) idx++;
      });
      // Fallback: count by position if ids don't line up (e.g. pool reshuffle).
      if (!idx) {
        idx = p.responses.length;
        seenCorrect = 0;
      }
      correct = seenCorrect;
      if (idx >= questions.length) {
        // Already finished previously — show results rather than replay.
        var score = p.finalScore || Math.round(
          p.responses.filter(function (r) { return r.isCorrect; }).length / questions.length * 100);
        el.quizZone.innerHTML =
          '<div class="results"><h2>Already complete</h2>' +
          '<div class="big-score">' + score + '%</div>' +
          '<p>Your last attempt for this pack.</p>' +
          (localBest() > 0 ? '<span class="best-badge">Best: ' + localBest() + '%</span>' : '') +
          '<div class="controls"><button class="btn-primary" id="retryBtn">Try Again</button>' +
          '<button class="btn-ghost" id="backToNotesBtn">Read Notes</button></div></div>';
        $('retryBtn').addEventListener('click', retake);
        $('backToNotesBtn').addEventListener('click', function () {
          document.getElementById('notesBody').scrollIntoView({ behavior: 'smooth' });
        });
        return;
      }
    }

    wireQuiz();
    renderQuestion(questions[idx], p && p.responses && p.responses.length ? null : null);
  }

  boot();
})();
</script>
</body>
</html>
