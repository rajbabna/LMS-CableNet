name: render-report

on:
  push:
    branches: [main]
    paths:
      - "token-usage.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render report from JSON
        run: python render-report.py

      - name: Stage artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/report-artifacts"
          cp token-cost-report.html token-cost-chart.svg "$RUNNER_TEMP/report-artifacts/"

      - name: Commit regenerated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add token-cost-report.html token-cost-chart.svg README.md
          if ! git diff --cached --quiet; then
            git commit -m "Auto-render report from token-usage.json (GitHub Actions)"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Mirror main to gh-pages (site + report)
        run: |
          git fetch origin main gh-pages
          git push origin origin/main:gh-pages --force
